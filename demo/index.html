<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvoiceDesk</title><link rel="stylesheet" href="style.css"><style>
#demo-banner{background:#fff7d6;color:#3b2f00;border-bottom:1px solid #e6cf7a;padding:8px 14px;font:13px/1.4 system-ui,sans-serif;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#demo-banner button{font:inherit;padding:3px 10px;border:1px solid #b99a1c;background:#fff;color:#3b2f00;border-radius:6px;cursor:pointer}
#demo-banner a{color:#5a4600}
#out{display:none!important}
@media(max-width:640px){#demo-banner{padding:5px 10px;font-size:12px;gap:8px}#demo-banner .long{display:none}#demo-banner button{padding:2px 8px}
header{padding:4px 14px!important}header nav{flex-wrap:nowrap!important;overflow-x:auto;white-space:nowrap}header nav button{flex:0 0 auto;padding:8px 10px!important}}</style><script src="sql-wasm.js"></script><script src="demo-config.js"></script><script src="runtime.js"></script></head><body>
<header><b>InvoiceDesk</b><nav id="nav" hidden><button data-v="dash" class="on">Dashboard</button><button data-v="inv">Invoices</button><button data-v="cli">Clients</button><button data-v="set">Settings</button></nav><button class="ghost sm" id="out" hidden>Log out</button></header>
<main>
<div id="setup" class="card" style="max-width:420px;margin:30px auto" hidden><h1>Create your account</h1><p class="mut">First run. Choose a username and a password of at least 10 characters. This form only works while no account exists.</p><form id="sf"><label for="su">Username</label><input id="su" autocomplete="username"><label for="sp">Password</label><input id="sp" type="password" autocomplete="new-password"><p id="serr" class="msg err" hidden></p><p><button>Create account</button></p></form></div>
<div id="login" class="card" style="max-width:380px;margin:40px auto" hidden><h1>Log in</h1><form id="lf"><label for="u">Username</label><input id="u" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p id="lerr" class="msg err" hidden></p><p><button>Log in</button></p></form></div>
<p id="amsg" class="msg" hidden></p>
<section id="dash" hidden></section><section id="inv" hidden></section><section id="cli" hidden></section><section id="set" hidden></section>
</main><div id="modal" class="modal" hidden></div>
<script>
const $=id=>document.getElementById(id);let ENV={},INV=[],CLI=[],filter='all',q='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,body)=>{const o=body===undefined?{}:{method:'POST',body:JSON.stringify(body)};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'Error');e.status=r.status;throw e}return d};
const M=c=>new Intl.NumberFormat('en',{style:'currency',currency:ENV.currency||'USD'}).format(c/100);
const note=(t,ok=true)=>{const m=$('amsg');m.className='msg '+(ok?'ok':'err');m.textContent=t;m.hidden=false;clearTimeout(note.t);note.t=setTimeout(()=>m.hidden=true,6000)};
const guard=fn=>async(...a)=>{try{await fn(...a)}catch(x){note(x.message,false)}};
const pill=s=>`<span class="pill ${s}">${s}</span>`;
async function boot(){const st=await api('/api/setup-status');['setup','login','dash','inv','cli','set'].forEach(i=>$(i).hidden=true);$('nav').hidden=$('out').hidden=true;
if(st.needsSetup){$('setup').hidden=false;return}
try{ENV=await api('/api/me')}catch{$('login').hidden=false;return}
$('nav').hidden=$('out').hidden=false;await refresh();view(sessionStorage.v||'dash')}
async function refresh(){const [i,c]=await Promise.all([api('/api/invoices'),api('/api/clients')]);INV=i.invoices;CLI=c.clients}
function view(v){sessionStorage.v=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['dash','inv','cli','set'].forEach(s=>$(s).hidden=s!==v);({dash:rDash,inv:rInv,cli:rCli,set:rSet})[v]()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)view(b.dataset.v)};
$('sf').onsubmit=async e=>{e.preventDefault();try{await api('/api/setup',{username:$('su').value,password:$('sp').value});boot()}catch(x){$('serr').textContent=x.message;$('serr').hidden=false}};
$('lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{username:$('u').value,password:$('p').value});boot()}catch(x){$('lerr').textContent=x.message;$('lerr').hidden=false}};
$('out').onclick=async()=>{await api('/api/logout',{});boot()};
async function rDash(){const d=await api('/api/dashboard');const max=Math.max(1,...d.months.map(m=>m.cents));
const ag=d.aging,tot=Math.max(1,d.outstanding),col={current:'#818cf8',d1_30:'#f79009',d31_60:'#f04438',d60plus:'#912018'},lab={current:'Not yet due',d1_30:'1 to 30 days late',d31_60:'31 to 60 days late',d60plus:'Over 60 days late'};
const od=INV.filter(i=>i.status==='overdue');
$('dash').innerHTML=`<h1>Dashboard</h1><div class="stats"><div class="stat"><span>Outstanding</span><b>${M(d.outstanding)}</b></div><div class="stat bad"><span>Overdue (${d.overdueCount})</span><b>${M(d.overdue)}</b></div><div class="stat ok"><span>Received this month</span><b>${M(d.receivedThisMonth)}</b></div><div class="stat"><span>Invoices</span><b>${INV.length}</b></div></div>
<div class="row" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Payments received, last 6 months</h2><div class="chart">${d.months.map(m=>`<div class="bar"><em>${m.cents?M(m.cents):''}</em><i style="height:${Math.round(m.cents/max*100)}%"></i><small>${m.month.slice(2)}</small></div>`).join('')}</div></div>
<div class="card"><h2>What is owed, by age</h2><div class="aging">${Object.keys(ag).map(k=>`<i style="width:${ag[k]/tot*100}%;background:${col[k]}"></i>`).join('')}</div><div class="legend">${Object.keys(ag).map(k=>`<span><b style="background:${col[k]}"></b>${lab[k]} ${M(ag[k])}</span>`).join('')}</div>
<h2 style="margin-top:16px">Biggest balances</h2>${d.topDebtors.map(t=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(t.name)}</span><b>${M(t.cents)}</b></div>`).join('')||'<p class="mut">Nothing owed.</p>'}</div></div>
<div class="card"><h2>Needs chasing</h2>${od.length?`<table class="cards"><tbody>${od.map(i=>`<tr class="click" data-id="${i.id}"><td data-l="Invoice"><b>${i.number}</b></td><td data-l="Client">${esc(i.client_name)}</td><td data-l="Due">${i.due_date}</td><td class="n" data-l="Balance"><b>${M(i.balance)}</b></td></tr>`).join('')}</tbody></table>`:'<p class="mut">No overdue invoices.</p>'}</div>`;
$('dash').querySelectorAll('tr.click').forEach(r=>r.onclick=guard(()=>detail(r.dataset.id)))}
function rInv(){const counts={all:INV.length};INV.forEach(i=>counts[i.status]=(counts[i.status]||0)+1);
const rows=INV.filter(i=>(filter==='all'||i.status===filter)&&(!q||(i.number+i.client_name).toLowerCase().includes(q.toLowerCase())));
$('inv').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>Invoices</h1><span><a class="btn ghost" href="api/export.csv">Export CSV</a> <button id="newinv">New invoice</button></span></div>
<div class="card"><div class="chips">${['all','draft','sent','partial','overdue','paid','void'].map(s=>`<button data-f="${s}" class="${filter===s?'on':''}">${s} ${counts[s]||0}</button>`).join('')}</div><input id="q" placeholder="Search number or client" value="${esc(q)}" style="max-width:300px;margin-bottom:10px">
<table class="cards"><thead><tr><th>Number</th><th>Client</th><th>Issued</th><th>Due</th><th>Status</th><th class="n">Total</th><th class="n">Balance</th></tr></thead><tbody>${rows.map(i=>`<tr class="click" data-id="${i.id}"><td data-l="Number"><b>${i.number}</b></td><td data-l="Client">${esc(i.client_name)}</td><td data-l="Issued">${i.issue_date}</td><td data-l="Due">${i.due_date}</td><td>${pill(i.status)}</td><td class="n" data-l="Total">${M(i.total)}</td><td class="n" data-l="Balance">${M(i.balance)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<p class="mut">No invoices match.</p>'}</div>`;
$('inv').querySelector('.chips').onclick=e=>{const b=e.target.closest('button');if(b){filter=b.dataset.f;rInv()}};
$('q').oninput=e=>{q=e.target.value;const pos=q.length;rInv();$('q').focus();$('q').setSelectionRange(pos,pos)};
$('newinv').onclick=newInvoice;$('inv').querySelectorAll('tr.click').forEach(r=>r.onclick=guard(()=>detail(r.dataset.id)))}
function modal(html){$('modal').innerHTML='<div>'+html+'</div>';$('modal').hidden=false}
function close_(){$('modal').hidden=true;$('modal').innerHTML=''}
$('modal').onclick=e=>{if(e.target===$('modal'))close_()};
async function detail(id){const {invoice:i}=await api('/api/invoices/'+id);
modal(`<div style="display:flex;justify-content:space-between;gap:10px"><div><h1 style="margin:0">${i.number} ${pill(i.status)}</h1><p class="mut">${esc(i.client_name)}${i.client_email?' · '+esc(i.client_email):''}<br>Issued ${i.issue_date}, due ${i.due_date}</p></div><button class="ghost sm" id="x" style="height:32px">Close</button></div>
<table><thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Unit</th><th class="n">Amount</th></tr></thead><tbody>${i.items.map(t=>`<tr><td>${esc(t.description)}</td><td class="n">${t.qty_milli/1000}</td><td class="n">${M(t.unit_cents)}</td><td class="n">${M(Math.round(t.qty_milli*t.unit_cents/1000))}</td></tr>`).join('')}</tbody></table>
<div class="tot"><div><span>Subtotal</span><span>${M(i.subtotal)}</span></div><div><span>Tax ${i.tax_bp/100}%</span><span>${M(i.tax)}</span></div><div class="g"><span>Total</span><span>${M(i.total)}</span></div><div><span>Paid</span><span>${M(i.paid)}</span></div><div class="g"><span>Balance due</span><span>${M(i.balance)}</span></div></div>
${i.payments.length?`<h2>Payments</h2>${i.payments.map(p=>`<div style="display:flex;justify-content:space-between"><span>${p.paid_on} ${esc(p.method||'')}</span><b>${M(p.amount_cents)}</b></div>`).join('')}`:''}
${i.state==='draft'?'<p class="mut">Marking as sent only changes the status here. Nothing is emailed. Use the print view to send it yourself.</p>':''}<p id="dmsg" class="msg err" hidden></p>
<div class="actions"><a class="btn ghost" target="_blank" href="print.html?id=${i.id}">Print view</a>${i.state==='draft'?'<button id="send">Mark as sent</button><button class="ghost" id="edit">Edit draft</button>':''}<button class="ghost" id="dup">Duplicate</button>${i.status==='overdue'?'<button class="ghost" id="rem">Copy reminder text</button>':''}${i.state==='draft'||(i.state==='sent'&&!i.paid)?'<button class="danger" id="void">Void</button>':''}</div>
${i.state==='sent'&&i.balance>0?`<div class="card" style="background:#f8f9fd"><h2>Record a payment</h2><div class="row"><div><label for="pa">Amount</label><input id="pa" type="number" step="0.01" value="${(i.balance/100).toFixed(2)}"></div><div><label for="pd">Date</label><input id="pd" type="date" value="${ENV.today}"></div><div><label for="pm">Method</label><input id="pm" placeholder="Bank transfer"></div></div><p><button id="pay">Record payment</button></p></div>`:''}`);
const act=(btn,fn)=>{const b=$(btn);if(b)b.onclick=async()=>{try{await fn();await refresh();close_();view(sessionStorage.v)}catch(x){$('dmsg').textContent=x.message;$('dmsg').hidden=false}}};
const pre_=()=>({clientId:i.client_id,issue:null,due:null,tax:i.tax_bp/100,notes:i.notes,items:i.items});
if($('edit'))$('edit').onclick=()=>newInvoice({...pre_(),issue:i.issue_date,due:i.due_date,editId:i.id,number:i.number});
$('dup').onclick=()=>newInvoice(pre_());
if($('rem'))$('rem').onclick=async()=>{const t=`Hello ${i.client_name}, a friendly reminder that invoice ${i.number} for ${M(i.balance)} was due on ${i.due_date}. Please let me know when payment is on its way, or if anything needs correcting. Thank you.`;try{await navigator.clipboard.writeText(t);note('Reminder text copied.')}catch{prompt('Copy this reminder:',t)}};
$('x').onclick=close_;act('send',()=>api(`/api/invoices/${id}/send`,{}));act('void',()=>{if(!confirm('Void this invoice?'))throw new Error('Cancelled');return api(`/api/invoices/${id}/void`,{})});
act('pay',()=>api(`/api/invoices/${id}/payments`,{amount:$('pa').value,paidOn:$('pd').value,method:$('pm').value}))}
function newInvoice(pre){pre=pre||{};const d0=pre.issue||ENV.today,d=pre.due||new Date(Date.parse(d0+'T00:00:00Z')+14*864e5).toISOString().slice(0,10);
modal(`<h1>${pre.editId?'Edit draft '+esc(pre.number):pre.items?'Duplicate invoice':'New invoice'}</h1><div class="row"><div><label for="nc">Client</label><select id="nc">${CLI.map(c=>`<option value="${c.id}"${c.id===pre.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label for="ni">Issue date</label><input type="date" id="ni" value="${d0}"></div><div><label for="nd">Due date</label><input type="date" id="nd" value="${d}"></div><div><label for="nt">Tax %</label><input type="number" id="nt" value="${pre.tax??0}" min="0" max="100" step="0.5"></div></div>
<label>Line items</label><div id="lines"></div><button class="ghost sm" id="addl">Add line</button>
<div class="tot" id="tt"></div><label for="nn">Notes (optional)</label><textarea id="nn" rows="2" maxlength="300">${esc(pre.notes||'')}</textarea><p id="dmsg" class="msg err" hidden></p><div class="actions"><button id="save">${pre.editId?'Save changes':'Save as draft'}</button><button class="ghost" id="x">Cancel</button></div>`);
const lines=$('lines');
const add=(d='',q=1,u='')=>{const r=document.createElement('div');r.className='li';r.innerHTML=`<input placeholder="Description" value="${esc(d)}" class="ld"><input type="number" min="0" step="0.5" value="${q}" class="lq" aria-label="Quantity"><input type="number" min="0" step="0.01" value="${u}" class="lu" placeholder="Unit price" aria-label="Unit price"><span class="amt">0.00</span><button class="ghost sm rm" type="button" aria-label="Remove line">x</button>`;lines.appendChild(r);calc()};
function calc(){let sub=0;lines.querySelectorAll('.li').forEach(r=>{const a=Math.round(Number(r.querySelector('.lq').value||0)*Math.round(Number(r.querySelector('.lu').value||0)*100));r.querySelector('.amt').textContent=M(a);sub+=a});const tax=Math.round(sub*Number($('nt').value||0)/100);$('tt').innerHTML=`<div><span>Subtotal</span><span>${M(sub)}</span></div><div><span>Tax</span><span>${M(tax)}</span></div><div class="g"><span>Total</span><span>${M(sub+tax)}</span></div>`}
lines.oninput=calc;$('nt').oninput=calc;lines.onclick=e=>{if(e.target.classList.contains('rm')&&lines.children.length>1){e.target.closest('.li').remove();calc()}};$('addl').onclick=()=>add();if(pre.items)pre.items.forEach(t=>add(t.description,t.qty_milli/1000,(t.unit_cents/100).toFixed(2)));else add();
$('x').onclick=close_;
$('save').onclick=async()=>{try{const items=[...lines.querySelectorAll('.li')].map(r=>({description:r.querySelector('.ld').value,qty:r.querySelector('.lq').value,unitPrice:r.querySelector('.lu').value}));
const r=await api(pre.editId?`/api/invoices/${pre.editId}/edit`:'/api/invoices',{clientId:$('nc').value,issueDate:$('ni').value,dueDate:$('nd').value,taxPercent:$('nt').value,items,notes:$('nn').value});await refresh();close_();filter='all';view('inv');note('Draft '+r.invoice.number+(pre.editId?' updated.':' saved.'))}catch(x){$('dmsg').textContent=x.message;$('dmsg').hidden=false}}}
async function rSet(){const {business:b,currency,timezone}=await api('/api/business');
$('set').innerHTML=`<h1>Settings</h1><div class="card"><h2>Your business details</h2><p class="mut">Printed at the top of every invoice. Currency (${esc(currency)}) and time zone (${esc(timezone)}) were set when the database was created.</p><div class="row"><div><label for="bn">Business name</label><input id="bn" value="${esc(b.business_name)}"></div><div><label for="be">Billing email</label><input id="be" value="${esc(b.business_email)}"></div><div><label for="ba">Address</label><input id="ba" value="${esc(b.business_address)}"></div><div><label for="bt">Tax or registration number (optional)</label><input id="bt" value="${esc(b.business_tax_id)}"></div></div><p class="mut">This app does not check tax rules. Make sure invoices meet the requirements where you operate.</p><p><button id="bs">Save</button></p></div>`;
$('bs').onclick=guard(async()=>{await api('/api/business',{business_name:$('bn').value,business_email:$('be').value,business_address:$('ba').value,business_tax_id:$('bt').value});note('Business details saved.')})}
function rCli(){const owed={};INV.forEach(i=>owed[i.client_id]=(owed[i.client_id]||0)+i.balance);
$('cli').innerHTML=`<h1>Clients</h1><div class="card"><table class="cards"><thead><tr><th>Name</th><th>Email</th><th>Address</th><th class="n">Owes</th><th></th></tr></thead><tbody>${CLI.map(c=>`<tr><td data-l="Name"><b>${esc(c.name)}</b></td><td data-l="Email">${esc(c.email||'')}</td><td data-l="Address">${esc(c.address||'')}</td><td class="n" data-l="Owes">${M(owed[c.id]||0)}</td><td><a class="btn ghost sm" target="_blank" href="statement.html?id=${c.id}">Statement</a></td></tr>`).join('')}</tbody></table></div>
<div class="card"><h2>Add a client</h2><div class="row"><div><label for="cn">Name</label><input id="cn"></div><div><label for="ce">Email</label><input id="ce" type="email"></div><div><label for="ca">Address</label><input id="ca"></div></div><p><button id="addc">Add client</button></p></div>`;
$('addc').onclick=guard(async()=>{await api('/api/clients',{name:$('cn').value,email:$('ce').value,address:$('ca').value});await refresh();rCli();note('Client added.')})}
boot();
</script></body></html>
